[package]
name = "impulse-kit"
version = "0.36.0"
edition = "2021"
description = "Impulse's pure logic (the Rust port of ImpulseKit), for the full-Rust migration"
license = "GPL-3.0-only"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
toml = "0.8"
dirs = "6"
url = "2"
regex = "1"
libc = "0.2"
# The command history database, the same SQLite file the Swift app keeps.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
