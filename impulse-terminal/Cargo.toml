[package]
name = "impulse-terminal"
version = "1.0.0"
edition = "2021"
description = "Terminal emulation backend for Impulse, built on alacritty_terminal"
license = "GPL-3.0-only"

[dependencies]
alacritty_terminal = "0.26"
crossbeam-channel = "0.5"
serde = { workspace = true }
log = { workspace = true }
bitflags = "2"
polling = "3.11"
libc = "0.2"
# Images programs send (the kitty graphics protocol): PNG decoding, zlib
# and base64, all pure Rust.
png = "0.18"
miniz_oxide = "0.8"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
