[package]
name = "impulse-app"
version = "1.1.0"
edition = "2021"
description = "The Impulse app in Rust on GPUI, for macOS and Linux (exploration)"
license = "GPL-3.0-only"

[dependencies]
# GPUI Kit (Longbridge's GPUI component library) re-exports the GPUI snapshot
# it was built against, so this one pin decides both.
# The grammars for the languages Monaco colors in the Swift app.
gpui-kit = { version = "=0.8.0", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-elixir",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    # Its grammar (tree-sitter-sequel) keeps `cc` on 1.2 for the workspace.
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
# JSON and HTML re-registered with Monaco's own token colors (base_rules.rs),
# at the versions GPUI Kit links.
tree-sitter = "0.26.13"
tree-sitter-json = "0.24.8"
tree-sitter-html = "0.23.2"
serde = { workspace = true }
serde_json = { workspace = true }
impulse-terminal = { path = "../impulse-terminal" }
impulse-kit = { path = "../impulse-kit" }
impulse-git = { path = "../impulse-git" }
env_logger = "0.11"
log = { workspace = true }
impulse-protocol = { path = "../impulse-protocol" }
libc = "0.2"
sha2 = "0.10"
impulse-lsp = { path = "../impulse-lsp" }
lsp-types = { version = "0.97", features = ["proposed"] }
futures = "0.3"
async-channel = "2"
# Editors follow their files on disk (FSEvents on macOS, inotify on Linux).
notify = "8"
anyhow = "1"
chrono = "0.4"
# Deleting files a workspace edit removes: to the Trash, as the Swift app does.
trash = "5"
# The Quick Terminal's system-wide shortcut (Carbon on macOS, as the Swift
# app does; XGrabKey on X11).
global-hotkey = "=0.7.0"
# GPUI's image type, for the images programs show in terminals
# (terminal_images.rs), at the version GPUI links.
image = { version = "0.25", default-features = false }
# The headless snapshots' windows (`debug_snapshot`): the X11 window id
# for `import`, and on macOS the NSWindow to keep transparent.
raw-window-handle = "0.6"
# GPUI as GPUI Kit links it, named only to turn on its test-support
# (`snapshot`).
snapshot-gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, optional = true }

[features]
# The macOS window images of debug builds' headless snapshots
# (debug_snapshot.rs) come from GPUI's `Window::render_to_image`, which only
# GPUI's test-support has (in gpui-pre, and gpui-pre-macos for the Metal
# renderer's side). Only those two crates: GPUI Kit's own test-support
# would change its components and pull GPUI Fast into the lock. Off by
# default, and a release build refuses it:
#   cargo build -p impulse-app -p impulse-cli --features impulse-app/snapshot
snapshot = [
    "dep:snapshot-gpui",
    "snapshot-gpui/test-support",
    "dep:snapshot-gpui-macos",
    "snapshot-gpui-macos?/test-support",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
snapshot-gpui-macos = { package = "gpui-pre-macos", version = "=0.3.9", default-features = false, optional = true }
