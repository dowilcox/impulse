<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; object-src 'none';"
    />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono/JetBrainsMono-Regular.ttf")
          format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono/JetBrainsMono-Bold.ttf")
          format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono/JetBrainsMono-Italic.ttf")
          format("truetype");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }

      /* Colors come from the host (SetTheme → chrome); these are fallbacks. */
      :root {
        --bg: #1a1b26;
        --panel: #16171f;
        --chrome: #14151d;
        --raised: #24283b;
        --hairline: #2b2f44;
        --hairline-strong: #363b55;
        --hover: rgba(192, 202, 245, 0.07);
        --text: #c0caf5;
        --text2: #a9b1d6;
        --text3: #565f89;
        --accent: #7aa2f7;
        --accent-soft: rgba(122, 162, 247, 0.16);
        --on-accent: #15161e;
        --added: #9ece6a;
        --removed: #f7768e;
        --modified: #e0af68;
        --renamed: #7dcfff;
        --conflict: #ff9e64;
        --added-bg: rgba(158, 206, 106, 0.1);
        --removed-bg: rgba(247, 118, 142, 0.11);
        --added-word: rgba(158, 206, 106, 0.28);
        --removed-word: rgba(247, 118, 142, 0.3);
        --selection: rgba(122, 162, 247, 0.22);
        --warning: #e0af68;
        --danger: #f7768e;
        --nav-width: 260px;
        --code-font: "JetBrains Mono", ui-monospace, Menlo, monospace;
        --ui-font: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        --row-h: 19px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--ui-font);
        font-size: 12px;
        overflow: hidden;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: default;
      }
      #app {
        display: grid;
        grid-template-columns: var(--nav-width) 1fr;
        height: 100%;
      }

      /* ---------------- Navigator ---------------- */
      #nav {
        background: var(--panel);
        border-right: 1px solid var(--hairline);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #nav-filter {
        margin: 8px;
        height: 24px;
        padding: 0 8px;
        border-radius: 5px;
        border: 1px solid var(--hairline-strong);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
      }
      #nav-filter:focus {
        border-color: var(--accent);
      }
      #nav-progress {
        height: 3px;
        margin: 0 10px 6px;
        border-radius: 2px;
        background: var(--hairline);
        overflow: hidden;
      }
      #nav-progress > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--added);
        transition: width 0.2s ease;
      }
      #nav-list {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 12px;
      }
      .nav-dir {
        padding: 6px 12px 2px;
        font-size: 10.5px;
        color: var(--text3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: left;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        margin: 0 6px;
        padding: 0 6px 0 8px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .nav-item:hover {
        background: var(--hover);
      }
      .nav-item.current {
        background: var(--accent-soft);
      }
      .nav-item .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-item.viewed .name {
        color: var(--text3);
      }
      .nav-item .changed {
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: var(--warning);
        flex: none;
      }
      .nav-item .comments {
        font-size: 10px;
        color: var(--accent);
      }
      .stat {
        font-family: var(--code-font);
        font-size: 10.5px;
        flex: none;
      }
      .stat .a {
        color: var(--added);
      }
      .stat .r {
        color: var(--removed);
        margin-left: 4px;
      }
      .status {
        font-family: var(--code-font);
        font-size: 10.5px;
        font-weight: 700;
        width: 12px;
        text-align: center;
        flex: none;
      }
      .status-A,
      .status-U {
        color: var(--added);
      }
      .status-M,
      .status-T {
        color: var(--modified);
      }
      .status-D {
        color: var(--removed);
      }
      .status-R {
        color: var(--renamed);
      }
      .status-C {
        color: var(--conflict);
      }
      .check {
        width: 13px;
        height: 13px;
        border-radius: 3px;
        border: 1px solid var(--text3);
        flex: none;
        display: inline-grid;
        place-items: center;
      }
      .check.on {
        background: var(--added);
        border-color: var(--added);
      }
      .check.on::after {
        content: "";
        width: 6px;
        height: 3px;
        border-left: 1.6px solid var(--on-accent);
        border-bottom: 1.6px solid var(--on-accent);
        transform: rotate(-45deg) translate(0.5px, -1px);
      }

      /* ---------------- Main ---------------- */
      #main {
        overflow-y: auto;
        overflow-x: hidden;
        min-width: 0;
        position: relative;
        scroll-padding-top: 40px;
      }
      #files {
        padding: 10px 12px 60vh;
      }
      .empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        color: var(--text3);
        font-size: 13px;
      }
      .card {
        margin-bottom: 10px;
        border: 1px solid var(--hairline);
        border-radius: 8px;
        overflow: clip;
        background: var(--bg);
      }
      .card.focused-file {
        border-color: var(--hairline-strong);
      }
      .card-header {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 8px 0 10px;
        background: var(--panel);
        white-space: nowrap;
      }
      .card:not(.collapsed) .card-header {
        border-bottom: 1px solid var(--hairline);
      }
      .chev {
        width: 14px;
        height: 14px;
        flex: none;
        color: var(--text3);
        transition: transform 0.12s ease;
      }
      .card.collapsed .chev {
        transform: rotate(-90deg);
      }
      .card-header .path {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
      }
      .card-header .path .dir {
        color: var(--text3);
      }
      .card-header .path .old {
        color: var(--text3);
        text-decoration: line-through;
        margin-right: 4px;
      }
      .viewed-toggle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--text2);
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .viewed-toggle:hover {
        background: var(--hover);
      }
      .changed-badge {
        font-size: 10px;
        color: var(--warning);
      }
      .act {
        height: 22px;
        padding: 0 8px;
        border-radius: 5px;
        font-size: 11px;
        color: var(--text2);
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .act:hover {
        background: var(--hover);
        color: var(--text);
      }
      .act.primary {
        border-color: var(--hairline-strong);
        color: var(--text);
      }
      .act.danger:hover {
        color: var(--danger);
      }
      .act[disabled] {
        opacity: 0.4;
        pointer-events: none;
      }
      .card.busy .card-body {
        opacity: 0.55;
        pointer-events: none;
      }
      .placeholder {
        padding: 14px 16px;
        color: var(--text3);
        font-style: italic;
      }
      .placeholder.error {
        color: var(--danger);
        font-style: normal;
      }

      /* Hunks */
      .hunk {
        border-top: 1px solid var(--hairline);
      }
      .hunk:first-child {
        border-top: 0;
      }
      .hunk.focused {
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .hunk-header {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px 0 10px;
        background: color-mix(in srgb, var(--accent) 6%, var(--bg));
        color: var(--text3);
        font-family: var(--code-font);
        font-size: 11px;
        white-space: nowrap;
      }
      .hunk-header .label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hunk-actions {
        display: flex;
        gap: 2px;
        font-family: var(--ui-font);
      }

      /* Rows */
      .rows {
        font-family: var(--code-font);
        font-size: 12px;
        line-height: var(--row-h);
      }
      .row {
        display: grid;
        grid-template-columns: 46px 46px 18px 1fr;
        min-height: var(--row-h);
      }
      .split .row {
        grid-template-columns: 46px 18px 1fr 46px 18px 1fr;
      }
      .gutter {
        text-align: right;
        padding-right: 8px;
        color: var(--text3);
        font-size: 11px;
        position: relative;
      }
      .gutter.selectable:hover {
        color: var(--text);
        background: var(--hover);
      }
      .marker {
        text-align: center;
        color: var(--text3);
      }
      .code {
        white-space: pre-wrap;
        word-break: break-all;
        padding-right: 12px;
        tab-size: 4;
        -webkit-user-select: text;
        user-select: text;
        cursor: text;
      }
      .row.added,
      .cell.added {
        background: var(--added-bg);
      }
      .row.removed,
      .cell.removed {
        background: var(--removed-bg);
      }
      .row.added .marker,
      .cell.added.marker {
        color: var(--added);
      }
      .row.removed .marker,
      .cell.removed.marker {
        color: var(--removed);
      }
      .row.selected,
      .cell.selected {
        box-shadow: inset 3px 0 0 var(--accent);
        background-image: linear-gradient(var(--selection), var(--selection));
      }
      .cell.blank {
        background: repeating-linear-gradient(
          135deg,
          transparent 0 4px,
          var(--hover) 4px 5px
        );
      }
      .word {
        border-radius: 2px;
      }
      .added .word {
        background: var(--added-word);
      }
      .removed .word {
        background: var(--removed-word);
      }
      .add-comment {
        position: absolute;
        left: 2px;
        top: 1px;
        width: 15px;
        height: 15px;
        border-radius: 4px;
        background: var(--accent);
        color: var(--on-accent);
        font-family: var(--ui-font);
        font-size: 12px;
        line-height: 15px;
        text-align: center;
        display: none;
      }
      .row:hover .add-comment {
        display: block;
      }

      /* Comments */
      .comment,
      .composer {
        margin: 4px 12px 8px 100px;
        border: 1px solid var(--hairline-strong);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        background: var(--panel);
        padding: 8px 10px;
        font-family: var(--ui-font);
        font-size: 12px;
        line-height: 1.45;
      }
      .split .comment,
      .split .composer {
        margin-left: 64px;
      }
      .comment.outdated {
        border-left-color: var(--text3);
        opacity: 0.8;
      }
      .comment .meta {
        display: flex;
        gap: 8px;
        color: var(--text3);
        font-size: 11px;
        margin-bottom: 3px;
      }
      .comment .meta .spacer {
        flex: 1;
      }
      .comment .meta .author {
        color: var(--text);
        font-weight: 600;
      }
      .comment .body {
        white-space: pre-wrap;
        -webkit-user-select: text;
        user-select: text;
      }
      .composer textarea {
        width: 100%;
        min-height: 54px;
        resize: vertical;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        -webkit-user-select: text;
        user-select: text;
      }
      .composer .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 6px;
      }
      .composer .hint {
        flex: 1;
        color: var(--text3);
        font-size: 11px;
        align-self: center;
      }
      .outdated-box {
        margin: 8px 12px;
      }
      .outdated-box > .title {
        color: var(--text3);
        font-size: 11px;
        margin: 4px 0;
      }
      .outdated-box .comment {
        margin-left: 0;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--hairline-strong);
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="nav" aria-label="Changed files">
        <input
          id="nav-filter"
          placeholder="Filter files (T)"
          spellcheck="false"
        />
        <div id="nav-progress"><i></i></div>
        <div id="nav-list"></div>
      </aside>
      <main id="main" tabindex="-1">
        <div id="files"><div class="empty">Loading changes…</div></div>
      </main>
    </div>

    <script src="vs/loader.js"></script>
    <script src="review.js"></script>
  </body>
</html>
