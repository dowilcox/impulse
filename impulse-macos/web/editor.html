<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; object-src 'none';"
    />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono/JetBrainsMono-Regular.ttf")
          format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono/JetBrainsMono-Bold.ttf")
          format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono/JetBrainsMono-Italic.ttf")
          format("truetype");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/jetbrains-mono/JetBrainsMono-BoldItalic.ttf")
          format("truetype");
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #container {
        width: 100%;
        height: 100%;
      }
      #loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      /* Gutter-to-code spacing is handled by Monaco's built-in padding
         option (padding: { left: 8 }) so hit testing stays accurate. */
      /* Native-style overlay scrollbars: rounded, auto-fade */
      .monaco-scrollable-element > .scrollbar > .slider {
        border-radius: 5px;
        transition: opacity 0.2s ease;
      }
      .monaco-scrollable-element > .scrollbar {
        transition: opacity 0.3s ease;
      }
      :root {
        --git-added: #9ece6a;
        --git-modified: #e0af68;
        --git-removed: #f7768e;
        --git-blame: rgba(128, 128, 128, 0.7);
        --git-peek-bg: #1f2335;
        --git-peek-fg: #c0caf5;
      }
      .monaco-editor .margin-view-overlays .diff-gutter-added,
      .monaco-editor .margin-view-overlays .diff-gutter-modified,
      .monaco-editor .margin-view-overlays .diff-gutter-deleted {
        cursor: pointer;
      }
      .git-blame-ghost {
        color: var(--git-blame) !important;
        font-style: italic;
        opacity: 0.75;
        cursor: pointer;
      }
      .conflict-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 100%;
        padding: 0 10px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 11.5px;
        color: var(--git-peek-fg);
        opacity: 0.9;
      }
      .conflict-bar .conflict-count {
        margin-left: 10px;
        font-variant-numeric: tabular-nums;
      }
      .conflict-current {
        background: color-mix(in srgb, var(--git-added) 13%, transparent);
      }
      .conflict-incoming {
        background: color-mix(in srgb, #7aa2f7 15%, transparent);
      }
      .conflict-marker-line {
        background: color-mix(in srgb, var(--git-modified) 18%, transparent);
        opacity: 0.85;
      }
      .git-peek {
        margin: 4px 0;
        border-top: 1px solid var(--git-modified);
        border-bottom: 1px solid var(--git-modified);
        background: var(--git-peek-bg);
        color: var(--git-peek-fg);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        overflow: hidden;
      }
      .git-peek-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
      }
      .git-peek-title {
        flex: 1;
        opacity: 0.8;
      }
      .git-peek-button {
        background: transparent;
        color: inherit;
        border: 1px solid rgba(128, 128, 128, 0.35);
        border-radius: 5px;
        padding: 1px 8px;
        font: inherit;
        cursor: pointer;
      }
      .git-peek-button:hover {
        background: rgba(128, 128, 128, 0.18);
      }
      .git-peek-old {
        margin: 0;
        padding: 2px 10px 6px 14px;
        max-height: 220px;
        overflow: auto;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        background: color-mix(in srgb, var(--git-removed) 12%, transparent);
        white-space: pre;
      }
      .diff-view {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        background: var(--git-peek-bg);
        color: var(--git-peek-fg);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
      }
      .diff-view-bar {
        flex: none;
        border-bottom: 1px solid rgba(128, 128, 128, 0.25);
      }
      .diff-view-file {
        font-weight: 600;
      }
      .diff-view-sides {
        opacity: 0.6;
      }
      .diff-view-summary {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .diff-view-editor {
        flex: 1;
        min-height: 0;
      }
      .vim-status {
        position: absolute;
        right: 14px;
        bottom: 6px;
        z-index: 20;
        display: none;
        padding: 1px 8px;
        border-radius: 5px;
        background: var(--git-peek-bg);
        color: var(--git-peek-fg);
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 11px;
        opacity: 0.85;
        pointer-events: none;
      }
      .vim-status:empty {
        display: none !important;
      }
      .vim-status input {
        background: transparent;
        color: inherit;
        border: none;
        outline: none;
        font: inherit;
        pointer-events: auto;
      }
      /* Default diff gutter colors (overridden by theme) */
      .diff-gutter-added {
        background: #9ece6a;
        width: 3px !important;
        margin-left: 7px;
      }
      .diff-gutter-modified {
        background: #e0af68;
        width: 3px !important;
        margin-left: 7px;
      }
      .diff-gutter-deleted {
        background: #f7768e;
        width: 3px !important;
        margin-left: 7px;
        height: 3px !important;
        position: relative;
        top: 50%;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle
          cx="24"
          cy="24"
          r="18"
          fill="none"
          stroke="rgba(255,255,255,0.1)"
          stroke-width="2.5"
        />
        <circle
          cx="24"
          cy="24"
          r="18"
          fill="none"
          stroke="rgba(255,255,255,0.35)"
          stroke-width="2.5"
          stroke-dasharray="28 85"
          stroke-linecap="round"
        >
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="0 24 24;360 24 24"
            dur="0.8s"
            repeatCount="indefinite"
          />
        </circle>
      </svg>
    </div>
    <div id="container" style="display: none"></div>

    <script src="vs/loader.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
