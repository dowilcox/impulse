[workspace]
members = [
    "impulse-app",
    "impulse-cli",
    "impulse-git",
    "impulse-kit",
    "impulse-lsp",
    "impulse-protocol",
    "impulse-terminal",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Dependencies (GPUI is large) build without debug info, so a checkout's
# target directory stays a few GB; our own crates keep full debug info.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The app to try out on the Mac (`--profile dev-app`): optimized, as a
# debug build scrolls too slowly to judge, but with debug assertions, so it
# keeps the dev build's own settings, session and socket (`impulse-dev`).
[profile.dev-app]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16
incremental = true
strip = false


# GPUI Kit's editor and component crates, vendored at the version
# impulse-app pins so its fixes can be patched in place
# (vendor/gpui-kit/README.md lists them).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-kit/gpui-base" }
gpui-component = { path = "vendor/gpui-kit/gpui-component" }
