[workspace]
members = ["impulse-app", "impulse-ffi", "impulse-kit", "impulse-terminal"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# GPUI (impulse-app) is built the way Zed builds it: these mirror the
# [patch.crates-io] entries in Zed's workspace at the tag impulse-app pins.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }
