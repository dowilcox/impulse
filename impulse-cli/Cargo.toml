[package]
name = "impulse-cli"
version = "0.36.0"
edition = "2021"
description = "The `impulse` command-line tool (the Rust port of ImpulseCLI)"
license = "GPL-3.0-only"

[[bin]]
name = "impulse"
path = "src/main.rs"

[dependencies]
impulse-protocol = { path = "../impulse-protocol" }
tempfile = "3"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
